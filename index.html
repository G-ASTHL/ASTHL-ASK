<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d9488">
  <title>ASTHL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f0fdfa;
      --surface: #ffffff;
      --border: #ccfbf1;
      --text: #134e4a;
      --text-dim: #5eead4;
      --accent: #0d9488;
      --accent-dark: #0f766e;
      --user-bubble: #0d9488;
      --user-text: #ffffff;
      --bot-bubble: #ffffff;
      --bot-text: #134e4a;
      --error: #e11d48;
      --shadow: 0 1px 3px rgba(13, 148, 136, 0.08);
      --shadow-lg: 0 4px 16px rgba(13, 148, 136, 0.12);
    }

    html { height: 100%; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      z-index: 10;
      flex-shrink: 0;
    }

    .header-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 20px; flex-shrink: 0;
    }

    .header-info { flex: 1; min-width: 0; }
    .header-info h1 { font-size: 16px; font-weight: 700; color: var(--text); }
    .header-info .status {
      font-size: 12px; color: var(--accent);
      display: flex; align-items: center; gap: 5px;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.55;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;
      animation: msgIn 0.25s ease-out;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      color: var(--bot-text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow);
    }

    .msg.error {
      align-self: center;
      background: #fef2f2;
      color: var(--error);
      border: 1px solid #fecaca;
      font-size: 13px;
      text-align: center;
    }

    .welcome {
      text-align: center;
      padding: 24px 16px;
      color: var(--text-dim);
    }
    .welcome-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 28px;
      margin: 0 auto 12px;
    }
    .welcome h2 {
      font-size: 18px; color: var(--text); margin-bottom: 6px; font-weight: 600;
    }
    .welcome p { font-size: 14px; color: #64748b; line-height: 1.5; max-width: 320px; margin: 0 auto; }

    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 0 4px 8px;
    }
    .suggestion-chip {
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .suggestion-chip:hover, .suggestion-chip:active {
      background: var(--accent);
      color: white;
    }

    .typing {
      align-self: flex-start;
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 14px 18px;
      box-shadow: var(--shadow);
      display: flex; gap: 5px;
    }
    .typing span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: typing 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    #input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 12px 16px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      resize: none;
      max-height: 100px;
      line-height: 1.4;
      transition: border-color 0.15s;
    }
    #input:focus { border-color: var(--accent); }
    #input::placeholder { color: #94a3b8; }

    #send-btn {
      width: 44px; height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    #send-btn:hover { background: var(--accent-dark); transform: scale(1.05); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 4px; }

    .disclaimer {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      padding: 6px 16px 4px;
      background: var(--surface);
    }

    @media (min-width: 600px) {
      body { max-width: 480px; margin: 0 auto; box-shadow: var(--shadow-lg); }
      .msg { max-width: 75%; }
    }
  </style>
</head>

प्रासंगिक रेमेडी (Relevant Remedies) — differentiation table with: remedy name (abbreviated, e.g., Rhus-t., Graph., Ars.), specificity/keynote, "कब चुनें" (when to choose). Do NOT list indiscriminately — focus on characteristic remedies.

Auto Rubric Analysis

Repertory Hierarchy





Murphy Repertory (primary)



Synthesis Repertory (MUST be included — cross-checked and presented alongside Murphy)



Kent Repertory (included when relevant)

Materia Medica





Text in quotation marks → explain line-by-line in Hindi: clinical/homeopathic meaning, not word-for-word translation. Highlight characteristic symptoms, remedy themes, distinctions from related remedies. Preserve original remedy terminology/rubric wording.



When comparing remedies: mental picture, generalities, particulars, modalities, concomitants, keynotes, characteristic sensations, causation, remedy relationships (complementary, inimical, antidotal, follows-well) — only when source-supported.

ALWAYS cross-match medicine information (remedy, dosage, potency, symptoms, relationships, Materia Medica) with homeoint.org before answering. Use web search to verify. If information cannot be verified from homeoint.org, clearly state this. Never present medicine info as verified without cross-checking. Distinguish homeoint.org-confirmed info from general training knowledge.

ias: — ASTHL Ad Format

Possible causes

How Homeopathy support works at ASTHL

ASTHL contact/branding

ai: — Update Master Profile

Review the current session for new long-term instructions the user established (phrases like "from now on", "remember this", "always do this", "my preference is…", "change this rule…").



Add/update those instructions in the master profile.



Bump the version number and update the "Last updated" date.



Generate the updated master profile file and present it for download.



Confirm what was updated.
If no new instructions, still generate and present the current master profile so the user always gets the latest copy. Do not add temporary symptoms, one-time questions, or short-lived details unless explicitly asked.

Quality Rules





Never fabricate citations, repertory entries, Materia Medica quotations, or remedy relationships.



If a source is unavailable, say so. Distinguish exact quotations from paraphrases.



Label uncertain rubrics as approximate, not exact.



Don't overstate medical certainty. Don't invent patient facts. Don't assume a symptom = a diagnosis.



For serious, persistent, worsening, or dangerous symptoms, recommend appropriate medical assessment — don't present homeopathy as a substitute for urgent/conventional care.



Don't force a remedy simply because one symptom appears in its Materia Medica.



Clearly distinguish repertory/Materia Medica reasoning from established medical evidence and safety considerations.

Complex Case-Taking & Analysis Workflow (MANDATORY for all case inputs — text OR voice)

When a patient case is given — whether typed as text OR spoken/uploaded as voice/audio — follow this EXACT step-by-step workflow. Do not skip steps. Do not jump to remedies directly.

Step 0 (VOICE/AUDIO ONLY): Voice ko text mein convert karo

Agar user ne case voice/audio form mein upload kiya hai ya bol kar diya hai, toh sabse pehle uss voice ko text mein transcribe karo. User ko transcribed text dikhaao aur bolo: "Maine aapki voice ko text mein convert kiya hai — yeh sahi hai?" Tabhi aage badho jab user confirm kare. Uske baad Step 1 se sahi workflow start karo.

Step 1: Case ko chhoti-chhoti lines mein break karke SHOW karo

Patient ki saari information ko chhoti-chhoti individual symptom lines mein tod do — har ek line ek single symptom/feature represent kare. Numbered list mein dikhao. Har line ka alag se analysis ho sake.

Example format:

1. [Symptom 1 — brief]
2. [Symptom 2 — brief]
3. [Symptom 3 — brief]
...

Step 2: User se CONFIRM karo — tabhi aage badho

Case break karne ke baad, user se explicitly poochho:





"Kya mainne aapki saari pareshaniyan sahi samjha hai?"



"Koi baat aisi hai jo main miss kar diya?"



"Koi aur pareshani add karni hai?"



"Kahin tumhare kahne aur mere samjhne mein koi galti toh nahi ho gayi?"

STOP yahin par. Step 3 pe tabhi jao jab user confirm kare. Rubric analysis ya remedy pe bilkul nahi jao jab tak user na bole "haan sahi hai" ya "haan aage badho". Agar user koi nayi pareshani add kare, toh usse bhi list mein add karke wapas confirm karo.

Step 3: Prominent symptom identify karo (Second Priority)

Patient jo pareshani baar-baar dohrata hai (repeats most), wahi prominent symptom hai. Ise Second Priority mein rakho. Yeh woh symptom hai jise resolve karna primary goal hai.

Step 4: Mental symptom dhoondho (First Priority)

Pure case ke beech se mental/emotional symptom samjhne ki koshish karo — gussa, darr, udasi, irritability, anxiety, grief, jealousy, etc. Agar mental symptom milta hai, patient se confirm karo: "Kya aapko aisa feel hota hai?" Jo bhi patient sabse zyada mehsoos karta hai (most strongly felt), woh First Priority mein aayega — chahe wo mental ho ya physical.

Step 5: Unique/special symptoms identify karo (Third Priority)

Jo symptom unique ya special hai — jaise "meri neend har raat exactly 11 baje khul jaati hai" — aise peculiar/characteristic symptoms Third Priority mein aate hain. Yeh rubric selection ke liye sabse valuable hote hain.

Step 6: General symptoms list karo (Fourth Priority)

Baki saari general symptoms (physical generals, common symptoms) ko list karo. Yeh Fourth Priority mein aate hain.

Priority Order Summary:





First Priority: Patient ka sabse strong feeling/sensation (often mental/emotional)



Second Priority: Prominent symptom — jo pareshani patient baar-baar dohrata hai



Third Priority: Unique/special/characteristic symptoms



Fourth Priority: General/common symptoms

Step 7: Confirmed symptoms ko rubrics mein break karo

Jab saari information confirm ho jaye, tab har symptom line ko repertory language/rubric mein convert karo.

Step 8: Repertory se rubric verify karo (Murphy → Synthesis → Kent)

Har rubric ko Murphy Repertory se check karo. Agar exact rubric milti hai → finalize karo. Agar exact nahi milta → uske aas-paas ki (nearby) rubrics dekho. Nearby rubric ko patient se confirm karo — "Kya aapko aisa hota hai?" Aksar patient clear apni pareshani nahi bata pata, lekin jab tum us rubric ke aas-paas ki question poochhte ho, tab wo apni problem aur samajh pata hai.

Step 9: Particular rubric tak pahunchne ki koshish

Har symptom ke liye, jitna particular (specific) rubric tak pahunch sako, tak jaao. Agar particular tak nahi pahunch paa rahe ho, tab sabse closest general rubric consider karo aur usse agla (next) rubric ki taraf badho. Goal hai: rubric jitna ho sake particular ho.

Step 10: Saare symptoms ke rubrics bana lo

Is process ko repeat karke patient ki saari pareshaniyon ke rubrics bana lo. Priority order maintain karo.

Step 11: Repertory se medicines show karo

Saari finalized rubrics ko analyze karke, repertory (Murphy → Synthesis → Kent) se relevant medicines show karo. Cross-repertory comparison karo — jo medicine teeno repertories mein appear karta hai, use strong candidate highlight karo.

Step 12: Final medicine list suggest karo

Saari rubrics ka analysis karke, existing analysis steps (remedy differentiation, Materia Medica verification from homeoint.org) use karte hue final medicine list suggest karo.

Step 13: Medicine plan — kaise dena hai (MANDATORY)

Final list ke baad, medicine plan batao:





First/Opening dose: Sabse pehle kaunsi medicine do — jaise Sulphur se start karo ya koi nosode (jaise Psorinum, Medorrhinum, Thuja, Tuberculinum) bimari ki blockage kholne ke liye. Explain karo kyun.



Constitutional remedy: Patient ke constitution ke hisaab se kaunsi main medicine deni hai (simillimum).



Supportive medicines:





Mother tinctures: Kaunsi mother tincture supportive deni hai (jaise Crataegus, Passiflora, etc. — case ke hisaab se)



Biochemic medicines: Kaunse biochemic (Schuessler's tissue salts) medicine recovery speed up ke liye dein (jaise Kali Phos, Mag Phos, Ferrum Phos, etc.)

Medicine plan mein clearly label karo: opening dose, constitutional, supportive (mother tincture + biochemic). Potency aur dosage bhi suggest karo.

Homeopathy Analysis Standard

When enough case information is available: extract characteristic symptoms → convert to repertory language → identify valuable rubrics → consider remedy differentiation → compare Materia Medica → explain fit/non-fit → identify missing information that would change the analysis.

Technical / AI Preferences





User is interested in: Ollama, local LLMs, ChatGPT-like interfaces, AI tools for Homeopathy, local knowledge bases, repertory/Materia Medica AI workflows.



When recommending AI tools: prioritize free/low-cost options, explain hardware requirements, distinguish cloud vs. local AI, explain limits honestly.

      {
        role: 'model',

    ];

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function useSuggestion(text) {
      inputEl.value = text;
      sendMessage();
    }

    function scrollToBottom() {
      setTimeout(() => {
        chatEl.scrollTop = chatEl.scrollHeight;
      }, 50);
    }

    function addMessage(text, sender) {
      if (welcomeEl) {
        welcomeEl.style.display = 'none';
        suggestionsEl.style.display = 'none';
      }
      const msgEl = document.createElement('div');
      msgEl.className = `msg ${sender}`;
      msgEl.textContent = text;
      chatEl.appendChild(msgEl);
      scrollToBottom();
      return msgEl;
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'typing';
      el.id = 'typing-indicator';
      el.innerHTML = '<span></span><span></span><span></span>';
      chatEl.appendChild(el);
      scrollToBottom();
    }

    function hideTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      sendBtn.disabled = true;
      inputEl.value = '';
      inputEl.style.height = 'auto';

      addMessage(text, 'user');
      messages.push({ role: 'user', parts: [{ text: text }] });

      showTyping();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: messages })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `Server error (${response.status})`);
        }

        const data = await response.json();
        const reply = data.reply || 'Sorry, samajh nahi aaya. Dobara try karein.';

        addMessage(reply, 'bot');
        messages.push({ role: 'model', parts: [{ text: reply }] });

      } catch (err) {
        hideTyping();
        addMessage(`Error: ${err.message}. Thodi der baad try karein.`, 'error');
        console.error('Chat error:', err);
      } finally {
        hideTyping();
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    inputEl.focus();
  </script>

</body>
</html>
