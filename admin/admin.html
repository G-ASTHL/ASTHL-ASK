<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTHL ADMIN — पूरा सिस्टम</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --accent:#0d9488; --dark:#0f766e; --text:#134e4a; --dim:#64748b; --bg:#f0fdfa; --line:#ccfbf1; }
  body { font-family: 'Noto Sans Devanagari', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  /* ===== LOGIN ===== */
  #login { position: fixed; inset: 0; background: linear-gradient(165deg,#062e2a,#0d6e60); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .lcard { background: #fff; border-radius: 24px; max-width: 400px; width: 100%; padding: 30px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .lcard h1 { font-size: 23px; text-align: center; }
  .lcard .sub { text-align: center; color: var(--dim); font-size: 13px; margin: 4px 0 20px; }
  .lcard label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .lcard input { width: 100%; font-family: inherit; font-size: 15px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; outline: none; margin-bottom: 13px; }
  .lcard input:focus { border-color: var(--accent); }
  .lcard button { width: 100%; font-family: inherit; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(135deg,#0d9488,#0f766e); border: none; border-radius: 14px; padding: 14px; cursor: pointer; }
  .remember { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); margin-bottom: 14px; }
  .remember input { width: auto; margin: 0; }
  #lerr { color: #e11d48; font-size: 13px; margin-top: 10px; display: none; text-align: center; }
  /* ===== DASH ===== */
  #dash { display: none; }
  .top { position: sticky; top: 0; z-index: 50; background: linear-gradient(135deg,#0f766e,#0d9488); color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .top b { font-size: 16px; }
  .top .badge { background: #fbbf24; color: #451a03; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .top .sp { flex: 1; }
  .top button { font-family: inherit; font-size: 13px; font-weight: 600; border: none; border-radius: 999px; padding: 8px 14px; cursor: pointer; background: rgba(255,255,255,.15); color: #fff; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; }
  .card .n { font-size: 26px; font-weight: 800; color: var(--dark); }
  .card .l { font-size: 12.5px; color: var(--dim); }
  .earn { background: linear-gradient(165deg,#0f766e,#0d9488); color: #fff; border-radius: 18px; padding: 18px; margin-bottom: 16px; }
  .earn h3 { font-size: 17px; margin-bottom: 10px; }
  .earn .row { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; border-bottom: 1px dashed rgba(255,255,255,.25); }
  .earn .row:last-child { border: none; font-weight: 800; font-size: 16px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
  .tabs button { font-family: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1.5px solid var(--line); background: #fff; color: var(--dark); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tools { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .tools input { flex: 1; min-width: 160px; font-family: inherit; font-size: 14px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; outline: none; }
  .tools button { font-family: inherit; font-size: 13px; font-weight: 600; border: none; border-radius: 12px; padding: 10px 14px; cursor: pointer; background: #fff; color: var(--dark); border: 1.5px solid var(--line); }
  .tablebox { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; overflow: auto; max-height: 62vh; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { position: sticky; top: 0; background: var(--dark); color: #fff; padding: 9px 10px; text-align: left; white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; min-width: 96px; max-width: 320px; overflow-wrap: anywhere; }
  tr:nth-child(even) td { background: #f8fefe; }
  .empty { padding: 30px; text-align: center; color: var(--dim); font-size: 14px; }
  .note { font-size: 12px; color: var(--dim); margin-top: 8px; }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="lcard">
    <h1>🔐 ASTHL ADMIN</h1>
    <div class="sub">पूरा सिस्टम — एक ही जगह (Excel की ज़रूरत नहीं)</div>
    <label>Admin ID</label>
    <input id="aid" value="ADMIN" autocomplete="username">
    <label>पासवर्ड</label>
    <input id="apw" type="password" autocomplete="current-password" placeholder="पासवर्ड डालें">
    <div class="remember"><input type="checkbox" id="aremember" checked><label for="aremember" style="margin:0;font-weight:400;">इस फ़ोन/कंप्यूटर पर याद रखें</label></div>
    <button id="alogin">🔓 लॉगिन करें</button>
    <div id="lerr"></div>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dash">
  <div class="top">
    <b>🩺 ASTHL ADMIN</b>
    <span class="badge" id="pending-badge">—</span>
    <span class="sp"></span>
    <button id="arefresh">🔄 रीफ़्रेश</button>
    <button id="alogout">🚪 लॉगआउट</button>
  </div>
  <div class="wrap">
    <div class="cards" id="cards"></div>
    <div class="earn" id="earn"></div>
    <div class="tabs" id="tabs"></div>
    <div class="tools">
      <input id="asearch" placeholder="🔍 कुछ भी खोजें (नाम, नंबर, केस ID, UTR...)">
      <button id="acsv">⬇️ CSV डाउनलोड</button>
    </div>
    <div class="tablebox"><div id="atable" class="empty">लोड हो रहा है...</div></div>
    <div class="note" id="anote"></div>
  </div>
</div>

<script>
var PW = '';
var DATA = null;
var TAB = 'Doctor Registration';
var COMMISSION = 13; // ASTHL commission % (baad me 23 kar sakte hain)

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fmtDate(v) {
  if (!v) return '';
  var d = new Date(v);
  if (isNaN(d)) return String(v);
  return d.toLocaleDateString('en-IN') + ' ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

// ===== LOGIN =====
function doLogin() {
  var pw = $('apw').value;
  if (!pw) { showErr('पासवर्ड डालें।'); return; }
  $('alogin').disabled = true; $('alogin').textContent = 'जाँच रहे हैं...';
  fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'ping', password: pw }) })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      $('alogin').disabled = false; $('alogin').textContent = '🔓 लॉगिन करें';
      if (!res.ok) { showErr((res.d && res.d.error) || 'लॉगिन नहीं हुआ।'); return; }
      PW = pw;
      if ($('aremember').checked) { try { localStorage.setItem('asthl_admin_pw', pw); } catch (e) {} }
      else { try { localStorage.removeItem('asthl_admin_pw'); } catch (e) {} }
      showDash(); loadData();
    })
    .catch(function () { $('alogin').disabled = false; $('alogin').textContent = '🔓 लॉगिन करें'; showErr('कनेक्शन त्रुटि — दोबारा कोशिश करें।'); });
}
function showErr(t) { $('lerr').style.display = 'block'; $('lerr').textContent = t; }
function showDash() { $('login').style.display = 'none'; $('dash').style.display = 'block'; }

// ===== DATA =====
function loadData() {
  $('atable').innerHTML = '<div class="empty">लोड हो रहा है...</div>';
  fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'getAll', password: PW }) })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (!res.ok) { $('atable').innerHTML = '<div class="empty">' + esc((res.d && res.d.error) || 'डेटा नहीं आया।') + '</div>'; return; }
      DATA = res.d.tabs || {};
      renderTabs(); renderCards(); renderEarn(); renderTable();
      $('anote').textContent = 'अंतिम अपडेट: ' + fmtDate(res.d.serverTime) + ' • हर टैब के आख़िरी 400 रिकॉर्ड दिखते हैं';
    })
    .catch(function () { $('atable').innerHTML = '<div class="empty">कनेक्शन त्रुटि — रीफ़्रेश करें।</div>'; });
}
function rows(tab) { return (DATA && DATA[tab] && DATA[tab].rows) || []; }
function headers(tab) { return (DATA && DATA[tab] && DATA[tab].headers) || []; }

function renderTabs() {
  var names = Object.keys(DATA);
  var html = '';
  names.forEach(function (n) {
    html += '<button class="' + (n === TAB ? 'on' : '') + '" onclick="setTab(\'' + esc(n) + '\')">' + esc(n) + ' (' + rows(n).length + ')</button>';
  });
  $('tabs').innerHTML = html;
}
function setTab(n) { TAB = n; renderTabs(); renderTable(); }

function renderCards() {
  var docs = rows('Doctor Registration');
  var chats = rows('Chat Log');
  var orders = rows('Medicine Order');
  var alerts = rows('Health Alerts');
  var ap = rows('Assign & Pay');
  var pendPay = ap.filter(function (r) { return String(r[8] || '').toLowerCase().indexOf('confirm') === -1 && String(r[8] || '').trim() !== ''; }).length;
  var pendAssign = ap.filter(function (r) { return String(r[10] || '').toLowerCase().indexOf('pending') !== -1; }).length;
  var pending = pendPay + pendAssign;
  $('pending-badge').textContent = pending > 0 ? ('⏳ ' + pending + ' काम बाक़ी') : '✅ कोई काम बाक़ी नहीं';
  var c = [
    ['👨‍⚕️', docs.length, 'डॉक्टर'],
    ['💬', chats.length, 'चैट लॉग'],
    ['💊', orders.length, 'दवा ऑर्डर'],
    ['🚨', alerts.length, 'Health Alerts'],
    ['📤', ap.length, 'Assign & Pay'],
    ['⏳', pendPay, 'भुगतान पुष्टि बाक़ी']
  ];
  $('cards').innerHTML = c.map(function (x) { return '<div class="card"><div class="n">' + x[1] + '</div><div class="l">' + x[0] + ' ' + x[2] + '</div></div>'; }).join('');
}

function renderEarn() {
  var ap = rows('Assign & Pay');
  // columns: 0 Date,1 CaseID,2 Patient,3 AssigningDoc,4 ConsultantID,5 ConsultantName,6 Fee,7 UTR,8 PayStatus,9 AdminConfirmed,10 Status...
  var byDoc = {};
  var total = 0;
  ap.forEach(function (r) {
    var paid = String(r[8] || '').toLowerCase().indexOf('confirm') !== -1 || String(r[9] || '').toLowerCase().indexOf('yes') !== -1;
    if (!paid) return;
    var fee = parseFloat(String(r[6] || '0').replace(/[^0-9.]/g, '')) || 0;
    var who = String(r[5] || r[4] || '—');
    byDoc[who] = (byDoc[who] || 0) + fee;
    total += fee;
  });
  var ded = Math.round(total * COMMISSION / 100);
  var html = '<h3>💰 Doctor Earnings & ASTHL हिसाब (' + COMMISSION + '% commission)</h3>';
  html += '<div class="row"><span>कुल परामर्श फीस (paid)</span><span>₹' + total + '</span></div>';
  html += '<div class="row"><span>ASTHL कमीशन (' + COMMISSION + '%)</span><span>− ₹' + ded + '</span></div>';
  html += '<div class="row"><span>डॉक्टरों को देय (Net payable)</span><span>₹' + (total - ded) + '</span></div>';
  var keys = Object.keys(byDoc);
  if (keys.length) {
    html += '<div style="margin-top:12px;font-size:13px;">';
    keys.forEach(function (k) {
      var g = byDoc[k], d2 = Math.round(g * COMMISSION / 100);
      html += '<div class="row"><span>' + esc(k) + '</span><span>₹' + g + ' → देय ₹' + (g - d2) + '</span></div>';
    });
    html += '</div>';
  } else {
    html += '<div style="margin-top:10px;font-size:12.5px;opacity:.85;">अभी कोई paid परामर्श नहीं — जैसे ही Assign & Pay me भुगतान confirm honge, hisaab yahan dikhega. (पेमेंट हर महीने के पहले हफ़्ते में)</div>';
  }
  $('earn').innerHTML = html;
}

function renderTable() {
  var hs = headers(TAB), rs = rows(TAB);
  var q = $('asearch').value.trim().toLowerCase();
  if (q) rs = rs.filter(function (r) { return r.join(' ').toLowerCase().indexOf(q) !== -1; });
  if (!hs.length || !rs.length) {
    $('atable').innerHTML = '<div class="empty">कोई रिकॉर्ड नहीं मिला' + (q ? ' — "' + esc(q) + '"' : '') + '</div>';
    return;
  }
  var html = '<table><thead><tr>';
  hs.forEach(function (h) { html += '<th>' + esc(h) + '</th>'; });
  html += '</tr></thead><tbody>';
  rs.slice().reverse().forEach(function (r) {
    html += '<tr>';
    hs.forEach(function (_, i) {
      var v = r[i];
      if (v instanceof Object || (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v))) v = fmtDate(v);
      var s = esc(v);
      if (s.length > 260) s = s.slice(0, 260) + '…';
      html += '<td>' + s + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  $('atable').innerHTML = html;
}

function downloadCSV() {
  var hs = headers(TAB), rs = rows(TAB);
  if (!hs.length) { alert('कोई डेटा नहीं।'); return; }
  var q = $('asearch').value.trim().toLowerCase();
  if (q) rs = rs.filter(function (r) { return r.join(' ').toLowerCase().indexOf(q) !== -1; });
  var lines = [hs.map(function (h) { return '"' + String(h).replace(/"/g, '""') + '"'; }).join(',')];
  rs.forEach(function (r) {
    lines.push(r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(','));
  });
  var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ASTHL-' + TAB.replace(/[^A-Za-z]/g, '-') + '.csv';
  a.click();
}

// ===== events =====
$('alogin').addEventListener('click', doLogin);
$('apw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
$('arefresh').addEventListener('click', loadData);
$('alogout').addEventListener('click', function () { try { localStorage.removeItem('asthl_admin_pw'); } catch (e) {} location.reload(); });
$('asearch').addEventListener('input', renderTable);
$('acsv').addEventListener('click', downloadCSV);

// auto-login (remember)
try {
  var saved = localStorage.getItem('asthl_admin_pw');
  if (saved) { $('apw').value = saved; doLogin(); }
} catch (e) {}
</script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); }); }</script>
</body>
</html>
